<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="devops-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  
  <!-- Outer Tech Ring (Dashed) -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="url(#devops-grad)" stroke-width="2" stroke-dasharray="4 2" opacity="0.4" />
  
  <!-- Inner Circle Background -->
  <circle cx="50" cy="50" r="41" fill="#0a0b0f" stroke="rgba(255,255,255,0.06)" stroke-width="1.5" />
  
  <!-- DevOps Infinity Loop merged with letter R -->
  <g>
    <!-- Stem of R (vertical pipeline with nodes) -->
    <line x1="34" y1="28" x2="34" y2="72" stroke="url(#devops-grad)" stroke-width="6" stroke-linecap="round"/>
    <!-- Network Nodes representing connections -->
    <circle cx="34" cy="28" r="4" fill="#2563eb" />
    <circle cx="34" cy="50" r="4" fill="#3b82f6" />
    <circle cx="34" cy="72" r="4" fill="#d97706" />
    
    <!-- Infinity loop path that forms the R loop -->
    <path d="M 34,50 
             C 45,50 48,32 60,32 
             C 72,32 75,50 60,50 
             C 45,50 42,68 34,50
             M 34,28
             C 48,28 50,50 34,50" 
          fill="none" 
          stroke="url(#devops-grad)" 
          stroke-width="5" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    
    <!-- Leg of R styled as a pipeline fork -->
    <path d="M 40,54 L 56,70" stroke="#d97706" stroke-width="5" stroke-linecap="round"/>
    <circle cx="56" cy="70" r="3" fill="#d97706" />
  </g>
</svg>
